name: auslan_translator
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # --- Core ML ---
      - torch==2.2.2          # CPU-only wheel for Mac Intel
      - numpy==1.26.4

      # --- Hugging Face (G2T) ---
      - transformers==4.40.2
      - datasets==2.19.1
      - evaluate==0.4.1
      - accelerate==0.29.3    # needed by Seq2SeqTrainer
      - sentencepiece==0.2.0  # required by T5 tokeniser
      - protobuf==3.20.3      # T5 tokeniser dependency

      # --- Evaluation ---
      - sacrebleu==2.4.0
      - scikit-learn==1.4.2

      # --- Data handling ---
      - pandas==2.2.2
      - openpyxl==3.1.2       # read/write .xlsx manifests
      - pyyaml==6.0.1         # experiment config loading

      # --- Feature extraction (V2G/E2E) ---
      - mediapipe==0.10.11
      - opencv-python==4.9.0.80

      # --- Utilities ---
      - tqdm==4.66.2
      - matplotlib==3.8.4     # confusion matrix visualisation